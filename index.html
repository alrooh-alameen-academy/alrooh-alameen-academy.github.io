:root {
  --bg: #EFE8F7;
  --surface: #F8F4FC;
  --text: #17112E;
  --muted: #3A3150;
  --accent: #6F5BA6;
  --accent-soft: #E6DDF4;
  --accent-text: #FFFFFF;
  --line: #DCD2EA;
  --focus: #6F5BA6;
}
[data-theme="night"] {
  --bg: #1C1830;
  --surface: #26213D;
  --text: #F4EEE2;
  --muted: #C9C0DA;
  --accent: #B9A7E8;
  --accent-soft: #3A3159;
  --accent-text: #1C1830;
  --line: #3E365C;
  --focus: #D5C8F5;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: "CairoEmbed", Cairo, "Geeza Pro", "Noto Naskh Arabic", "Segoe UI", Tahoma, Arial, sans-serif;
  font-size: 18px;
  line-height: 1.9;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  transition: background-color .3s, color .3s;
}
.wrap {
  width: 100%;
  max-width: 720px;
  margin: 0 auto;
  padding-left: 20px;
  padding-right: 20px;
}
header.top {
  padding: 20px 0 8px;
  border-bottom: 1px solid var(--line);
}
.top .wrap {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}
.brand { min-width: 0; }
.brand h1 {
  margin: 0;
  font-size: 1.55rem;
  font-weight: 800;
  line-height: 1.5;
  color: var(--accent);
  overflow-wrap: anywhere;
}
.brand p {
  margin: 0;
  font-size: 1rem;
  color: var(--muted);
  line-height: 1.6;
}
.theme-toggle {
  flex: 0 0 auto;
  font: inherit;
  font-size: 1rem;
  font-weight: 700;
  color: var(--accent);
  background: var(--surface);
  border: 1.5px solid var(--accent);
  border-radius: 999px;
  padding: 8px 16px;
  min-height: 44px;
  cursor: pointer;
}
main { flex: 1; padding: 28px 0 36px; }
.home {
  text-align: center;
  padding: 8px 0 28px;
  margin-bottom: 28px;
  border-bottom: 1px solid var(--line);
}
.home p {
  margin: 0 0 1.1em;
  font-size: 1.12rem;
  line-height: 2.1;
}
.home p.verse-main { font-weight: 700; color: var(--accent); }
h2.section { margin: 0 0 14px; font-size: 1.1rem; color: var(--muted); font-weight: 700; }
.acc-item {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 14px;
  margin-bottom: 14px;
  overflow: hidden;
}
.acc-head {
  margin: 0;
}
.acc-btn {
  display: flex;
  width: 100%;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  min-height: 60px;
  padding: 14px 20px;
  background: transparent;
  color: var(--text);
  border: 0;
  font: inherit;
  font-size: 1.15rem;
  font-weight: 700;
  text-align: right;
  cursor: pointer;
}
.acc-btn:hover { background: var(--accent-soft); }
.acc-btn .chev {
  flex: 0 0 auto;
  width: 30px;
  height: 30px;
  border-radius: 50%;
  background: var(--surface);
  border: 1.5px solid var(--line);
  color: var(--accent);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  transition: transform .25s;
}
.acc-btn[aria-expanded="true"] .chev { transform: rotate(180deg); }
.acc-panel { border-top: 1px solid var(--line); padding: 6px 0; }
.acc-panel[hidden] { display: none; }
.acc-panel ul { list-style: none; margin: 0; padding: 0; }
.acc-panel li {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 12px 20px;
  min-height: 52px;
  border-bottom: 1px dashed var(--line);
  font-size: 1.05rem;
}
.acc-panel li:last-child { border-bottom: 0; }
.soon {
  flex: 0 0 auto;
  font-size: .9rem;
  color: var(--accent);
  background: var(--accent-soft);
  border-radius: 999px;
  padding: 2px 12px;
  white-space: nowrap;
}
footer {
  padding: 22px 0 28px;
  border-top: 1px solid var(--line);
  color: var(--muted);
  text-align: center;
  font-size: .95rem;
}
footer .dev { direction: ltr; unicode-bidi: isolate; font-family: "CairoEmbed", Cairo, Arial, sans-serif; }
button:focus-visible, a:focus-visible {
  outline: 3px solid var(--focus);
  outline-offset: 3px;
}
@media (min-width: 600px) {
  body { font-size: 19px; }
  .brand h1 { font-size: 1.9rem; }
  .home p { font-size: 1.22rem; }
}
@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; }
}

/* phrase shapes */
.home{position:relative}
.home p{position:relative;padding:14px 18px;margin:14px 0;border-radius:18px;background:rgba(200,180,230,.18);border:1px solid rgba(150,120,200,.35);animation:rise .9s ease both}
.home p:nth-child(2){animation-delay:.2s}.home p:nth-child(3){animation-delay:.4s}.home p:nth-child(4){animation-delay:.6s}
.home p::before,.home p::after{content:"✦";position:absolute;color:#9b7fc4;font-size:14px;animation:twinkle 2.4s ease-in-out infinite}
.home p::before{top:-8px;right:12px}.home p::after{bottom:-8px;left:12px;animation-delay:1.2s}
.home .verse-main{font-weight:700;background:rgba(200,180,230,.3)}
.home::after{content:"";position:absolute;width:120px;height:120px;border-radius:30%;border:2px dashed rgba(155,127,196,.4);bottom:-30px;right:-20px;animation:spin 18s linear infinite}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes twinkle{0%,100%{opacity:.25;transform:scale(.8)}50%{opacity:1;transform:scale(1.2)}}
@keyframes drift{from{transform:translate(0,0)}to{transform:translate(30px,20px)}}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.home p,.home p::before,.home p::after,.home::before,.home::after{animation:none}}

.topmenu{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin-top:10px}
.topword{font-size:13px;padding:6px 12px;border-radius:999px;background:rgba(200,180,230,.25);border:1px solid rgba(150,120,200,.35);cursor:default}
.topbtn{font:inherit;font-size:13px;padding:6px 12px;border-radius:999px;border:1px solid rgba(150,120,200,.5);background:rgba(200,180,230,.25);color:inherit;cursor:pointer}
.topbtn:active{transform:scale(.97)}

.subpage{display:none}
.subpage.on{display:block}
body.paged .home,body.paged nav[aria-label="الأقسام"]{display:none}
.backbtn{font:inherit;padding:8px 16px;border-radius:999px;border:1px solid rgba(150,120,200,.5);background:transparent;color:inherit;cursor:pointer;margin:14px 0}
.subpage h2{margin:8px 0 14px}
.subitem{all:unset;cursor:pointer;display:flex;justify-content:space-between;width:100%;box-sizing:border-box}
.subitem:focus-visible{outline:2px solid var(--focus)}
</style>

<script>
(function () {
  var root = document.documentElement;
  var toggle = document.getElementById('themeToggle');
  var KEY = 'alrooh-theme';

  function applyTheme(mode) {
    var night = mode === 'night';
    root.setAttribute('data-theme', night ? 'night' : 'morning');
    toggle.textContent = night ? '☀️' : '🌙';
    toggle.setAttribute('aria-label', night ? 'التبديل إلى الوضع الصباحي' : 'التبديل إلى الوضع الليلي');
    try { localStorage.setItem(KEY, night ? 'night' : 'morning'); } catch (e) {}
  }

  var saved = null;
  try { saved = localStorage.getItem(KEY); } catch (e) {}
  applyTheme(saved === 'night' ? 'night' : 'morning');

  toggle.addEventListener('click', function () {
    applyTheme(root.getAttribute('data-theme') === 'night' ? 'morning' : 'night');
  });

  var buttons = document.querySelectorAll('.acc-btn');
  function closeAll(except) {
    buttons.forEach(function (b) {
      if (b === except) return;
      b.setAttribute('aria-expanded', 'false');
      document.getElementById(b.getAttribute('aria-controls')).hidden = true;
    });
  }
  buttons.forEach(function (btn) {
    btn.addEventListener('click', function () {
      var open = btn.getAttribute('aria-expanded') === 'true';
      closeAll(btn);
      btn.setAttribute('aria-expanded', open ? 'false' : 'true');
      document.getElementById(btn.getAttribute('aria-controls')).hidden = open;
    });
  });
})();
</script>

<script>
document.querySelectorAll('.topbtn').forEach(function(b){
  b.addEventListener('click',function(){
    var t=document.getElementById(b.getAttribute('data-target'));
    if(!t) return;
    if(t.getAttribute('aria-expanded')!=='true') t.click();
    var item=t.closest('.acc-item')||t;
    item.scrollIntoView({behavior:'smooth',block:'start'});
  });
});
</script>

<script>
(function(){

    var QALOON=["الاستعاذة والبسملة", "صلة ميم الجمع، والفتح والإمالة", "المد والقصر ومعه لفظ أنا", "النون الساكنة والتنوين", "التقاء الساكنين", "التحريرات", "ورقمهم"];

    // ── المحاضرات ── الصقي روابطك هنا، محاضرة في كل سطر:
    // chapter: اسم الفصل بالضبط كما هو في القائمة فوق
    // title: عنوان المحاضرة | youtube: رابط يوتيوب (غير مدرج) | drive: رابط ملف Google Drive
    var LECTURES=[
      // { chapter: "الاستعاذة والبسملة", title: "المحاضرة الأولى", youtube: "https://youtu.be/XXXXXXXX", drive: "https://drive.google.com/file/d/XXXXXXXX/view?usp=sharing" },
    ];
    function driveDownload(u){var m=u.match(/\/d\/([\w-]+)/)||u.match(/[?&]id=([\w-]+)/);return m?'https://drive.google.com/uc?export=download&id='+m[1]:u;}
    function renderQaloon(wrap){
      var box=document.createElement('div');box.className='qlist';
      QALOON.forEach(function(t,idx){
        var item=document.createElement('div');item.className='qitem';
        var tb=document.createElement('button');tb.type='button';tb.className='qtitle';tb.textContent=t;
        var pan=document.createElement('div');pan.className='qpanel';pan.hidden=true;
        var vb=document.createElement('button');vb.type='button';vb.className='qbtn';vb.textContent='فيديو الشرح';
        var fb=document.createElement('button');fb.type='button';fb.className='qbtn';fb.textContent='الملفات';
        var area=document.createElement('div');area.className='qarea';
        vb.addEventListener('click',function(){
          area.innerHTML='';
          if(idx===0){var v=document.createElement('video');v.controls=true;v.playsInline=true;v.preload='metadata';v.src='qaloon-1.mp4';v.className='qvideo';area.appendChild(v);}
          else{var s=document.createElement('p');s.textContent='قريبًا';area.appendChild(s);}
        });
        fb.addEventListener('click',function(){area.innerHTML='';var s=document.createElement('p');s.textContent='قريبًا';area.appendChild(s);});
        pan.appendChild(vb);pan.appendChild(fb);pan.appendChild(area);
        tb.addEventListener('click',function(){pan.hidden=!pan.hidden;});
        var lecs=LECTURES.filter(function(L){return L.chapter===t;});
        if(lecs.length){
          var list=document.createElement('div');list.className='lecs';
          lecs.forEach(function(L){
            var row=document.createElement('div');row.className='lec';
            var name=document.createElement('span');name.className='lec-title';name.textContent=L.title;
            var btns=document.createElement('div');btns.className='lec-btns';
            if(L.youtube){var w=document.createElement('a');w.className='qbtn';w.href=L.youtube;w.target='_blank';w.rel='noopener';w.textContent='مشاهدة';btns.appendChild(w);}
            if(L.drive){var d=document.createElement('a');d.className='qbtn';d.href=driveDownload(L.drive);d.target='_blank';d.rel='noopener';d.textContent='تحميل';btns.appendChild(d);}
            row.appendChild(name);row.appendChild(btns);list.appendChild(row);
          });
          pan.appendChild(list);
        }
        item.appendChild(tb);item.appendChild(pan);box.appendChild(item);
      });
      wrap.appendChild(box);
    }
  var wrap=document.createElement('section');
  wrap.className='subpage';wrap.id='subpage';wrap.setAttribute('aria-live','polite');
  document.querySelector('main.wrap').appendChild(wrap);
  function openSub(title){
    wrap.innerHTML='';
    var back=document.createElement('button');back.type='button';back.className='backbtn';back.textContent='رجوع للرئيسية';
    back.addEventListener('click',function(){document.body.classList.remove('paged');wrap.classList.remove('on');window.scrollTo(0,0);});
    var h=document.createElement('h2');h.textContent=title;
    var p=document.createElement('p');p.textContent='قريبًا';
    wrap.appendChild(back);wrap.appendChild(h);
    if(title==='قالون'){renderQaloon(wrap);}else{wrap.appendChild(p);}
    document.body.classList.add('paged');wrap.classList.add('on');
    window.scrollTo(0,0);
  }
  document.querySelectorAll('.subitem').forEach(function(b){
    b.addEventListener('click',function(){openSub(b.getAttribute('data-sub'));});
  });
})();
</script>
</body>
